name: CI
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,azure]'
      - run: make lint
      - run: make test
      - run: make build
      - run: make verify-wheel
      - run: git diff --check
