name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,azure]'
      - run: make contract-lock
      - run: make lint
      - run: make test
      - run: make verify-wheel
      - run: git diff --check

  full-certification:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,azure,spark]'
      - run: make test-all
        env:
          LANDFALL_TEST_SCALE: ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landfall-certification-${{ github.sha }}
          path: artifacts/test-runs/
          if-no-files-found: warn
