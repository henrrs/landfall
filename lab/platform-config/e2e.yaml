storageTopology:
  domains:
    customer:
      storageAccount: devstoreaccount1
      containers:
        landing: landing-zone
        bronze: bronze
        silver: silver
        gold: gold
registries:
  sourceSystems: [crm]
storage:
  type: adls
  connectionStringEnv: LANDFALL_ADLS_CONNECTION_STRING
  dfsHostHeader: devstoreaccount1.dfs.core.windows.net
secrets:
  provider: keyvault
  emulator: true
  vaultUrl: https://keyvault:4997
  references:
    crm-local: crm-local
landing:
  format: arrow-ipc
  compression: lz4
planner:
  targetPartitionBytes: 100
  minimumPartitionBytes: 1
  desiredWaves: 2
runtime:
  type: local
