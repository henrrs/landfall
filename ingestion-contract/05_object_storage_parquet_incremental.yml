apiVersion: ingestion.contract/v1alpha1
kind: IngestionContract

metadata:
  version: 1.0.0
  domain: customer
  sourceSystem: crm_exports
  owner: customer-data
  costAllocation: customer
  tags:
    criticality: medium

source:
  connector: object-storage
  connectionRef: customer-landing
  resource:
    path: /crm/customer/
    pattern: "*.parquet"

fields:
  - name: customer_id
    type: int64
  - name: name
    type: string
  - name: email
    type: string
  - name: updated_at
    type: timestamp

read:
  mode: incremental
  initialPosition: beginning
  position:
    strategy: source_native

target:
  asset: customer
  write:
    mode: append
