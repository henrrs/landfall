apiVersion: ingestion.contract/v1alpha1
kind: IngestionContract

metadata:
  version: 1.0.0
  domain: customer
  sourceSystem: customer_events
  owner: customer-data
  costAllocation: customer
  tags:
    criticality: high

source:
  connector: kafka
  connectionRef: customer-events-prod
  resource:
    topic: customer-events

fields:
  - name: customer_id
    type: int64
  - name: event_type
    type: string
  - name: occurred_at
    type: timestamp
  - name: payload
    type: string

read:
  mode: continuous
  initialPosition: beginning
  position:
    strategy: source_native

target:
  asset: customer_event
  write:
    mode: append
